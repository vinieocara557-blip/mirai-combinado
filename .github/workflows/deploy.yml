name: build-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode binaries and assemble site
        run: |
          mkdir site
          cp *.html *.js *.css *.svg *.webmanifest site/
          for f in b64/*.b64; do n=$(basename "$f" .b64); base64 -d "$f" > "site/$n"; done
          touch site/.nojekyll
      - name: Publish to gh-pages
        run: |
          cd site
          git init -b gh-pages
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -m deploy
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" gh-pages
