name: enable-pages
on:
  push:
    branches: [main]
    paths: ['.github/workflows/enable.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
